# slack-to-ntfy configuration
#
# Each endpoint is the equivalent of one Proxmox VE "generic webhook" target.
# An app that normally posts to a Slack incoming webhook instead posts to
#   http://<host>:8080/hook/<name>
# and this service renders the templates below and forwards to ntfy.
#
# Template variables available (Jinja2, same {{ }} syntax as Proxmox):
#   {{ title }}      derived title (header block / attachment title / username)
#   {{ message }}    flattened, human-readable message body
#   {{ text }}       the raw Slack `text` field
#   {{ priority }}   1..5 derived from attachment color (danger=5, warning=4)
#   {{ emoji }}      icon_emoji with the colons stripped (usable as an ntfy tag)
#   {{ color }}      first attachment color
#   {{ username }}   {{ channel }}   {{ icon_url }}
#   {{ payload }}    the full parsed Slack payload, e.g. {{ payload.attachments[0].title }}
#   {{ secrets.X }}  values from this endpoint's `secrets` block

server:
  host: 0.0.0.0
  port: 8080

endpoints:
  # Mirrors the Proxmox screenshot: POST to a topic with an auth token,
  # a templated Title header, a fixed tag, and the message as the body.
  - name: dc_proxmox_alerts
    enabled: true
    method: POST
    url: "https://ntfy.example.com/dc_proxmox_alerts"
    headers:
      # Sent only when a token is configured. Headers that render empty are
      # dropped, so this works fine against ntfy instances without auth.
      Authorization: "{% if secrets.token %}Bearer {{ secrets.token }}{% endif %}"
      Title: "DC PVE - {{ title }}"
      Priority: "{{ priority }}"
      Tags: "computer"
    body: "{{ message }}"
    secrets:
      # Optional (but recommended). Pulled from the NTFY_TOKEN env var;
      # empty if unset, in which case the Authorization header is omitted.
      token: "${NTFY_TOKEN}"

  # A second target that maps Slack's emoji + color onto ntfy tags/priority,
  # and requires an inbound token for hardening.
  - name: app_notifications
    enabled: true
    url: "https://ntfy.example.com/app_notifications"
    headers:
      Authorization: "{% if secrets.token %}Bearer {{ secrets.token }}{% endif %}"
      Title: "{{ title }}"
      Priority: "{{ priority }}"
      Tags: "{{ emoji or 'speech_balloon' }}"
      Markdown: "yes"
    body: "{{ message }}"
    secrets:
      token: "${NTFY_TOKEN}"
    inbound_token: "${INBOUND_TOKEN}"
