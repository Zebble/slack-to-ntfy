# slack-to-ntfy configuration
#
# Each endpoint defines how a Slack payload is transformed and forwarded to an
# ntfy topic. An app that normally posts to a Slack incoming webhook instead
# posts to
#   http://<host>:8080/hook/<name>
# and this service renders the templates below and forwards to ntfy.
#
# Template variables available (Jinja2 {{ }} syntax):
#   {{ title }}      derived title (header block / attachment title / username)
#   {{ message }}    flattened, human-readable message body
#   {{ text }}       the raw Slack `text` field
#   {{ priority }}   1..5 derived from attachment color (danger=5, warning=4)
#   {{ emoji }}      icon_emoji with the colons stripped (usable as an ntfy tag)
#   {{ color }}      first attachment color
#   {{ username }}   {{ channel }}   {{ icon_url }}
#   {{ payload }}    the full parsed Slack payload, e.g. {{ payload.attachments[0].title }}
#   {{ secrets.X }}  values from this endpoint's `secrets` block

server:
  host: 0.0.0.0
  port: 8080

endpoints:
  # POST to a topic with an auth token, a templated Title header carrying a
  # static prefix, a fixed tag, and the message as the body.
  - name: system_alerts
    enabled: true
    method: POST
    url: "https://ntfy.example.com/system_alerts"
    headers:
      # Sent only when a token is configured. Headers that render empty are
      # dropped, so this works fine against ntfy instances without auth.
      Authorization: "{% if secrets.token %}Bearer {{ secrets.token }}{% endif %}"
      Title: "Alert - {{ title }}"
      Priority: "{{ priority }}"
      Tags: "computer"
    body: "{{ message }}"
    secrets:
      # This endpoint's ntfy (outbound) token. Optional but recommended; empty
      # if unset, in which case the Authorization header above is omitted.
      token: "${NTFY_TOKEN}"

  # A second target with its OWN ntfy token and its own inbound (Slack-side)
  # token — tokens are per-endpoint. It also maps Slack's emoji + color onto
  # ntfy tags/priority.
  - name: app_notifications
    enabled: true
    url: "https://ntfy.example.com/app_notifications"
    headers:
      Authorization: "{% if secrets.token %}Bearer {{ secrets.token }}{% endif %}"
      Title: "{{ title }}"
      Priority: "{{ priority }}"
      Tags: "{{ emoji or 'speech_balloon' }}"
      Markdown: "yes"
    body: "{{ message }}"
    secrets:
      # A different ntfy token than system_alerts (point at the same env var
      # instead if you want them to share one).
      token: "${NTFY_TOKEN_APP}"
    # Callers to /hook/app_notifications must present this token (via the
    # X-Slack-To-Ntfy-Token header or ?token=). Per-endpoint; system_alerts
    # above requires none.
    inbound_token: "${INBOUND_TOKEN_APP}"
