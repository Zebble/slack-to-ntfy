version: 2
updates:
  # Python dependencies: one weekly PR for minor/patch, separate PR for any major.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
      pip-major:
        update-types: ["major"]

  # GitHub Actions: one weekly PR for minor/patch, separate PR for any major.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]

  # Docker base image: one weekly PR for minor/patch, separate PR for any major.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
      docker-major:
        update-types: ["major"]
