services:
  slack-to-ntfy:
    build: .
    image: slack-to-ntfy:latest
    container_name: slack-to-ntfy
    restart: unless-stopped
    # Values below come from .env (auto-loaded by compose). See .env.example.
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Referenced as ${NTFY_TOKEN} / ${INBOUND_TOKEN} in config.yaml.
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - INBOUND_TOKEN=${INBOUND_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FORWARD_TIMEOUT=${FORWARD_TIMEOUT:-10}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
