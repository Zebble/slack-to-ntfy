services:
  slack-to-ntfy:
    # Pulls the prebuilt multi-arch image from GHCR by default. Pass `--build`
    # to `docker compose up` (or run `docker compose build`) to build locally
    # from the included Dockerfile and tag it with this same image name.
    image: ghcr.io/zebble/slack-to-ntfy:latest
    build: .
    container_name: slack-to-ntfy
    restart: unless-stopped
    # HOST_PORT is interpolated from the auto-loaded .env. See .env.example.
    ports:
      - "${HOST_PORT:-8080}:8080"
    # Inject the whole .env into the container so any per-endpoint token var
    # referenced from config.yaml (e.g. ${NTFY_TOKEN_APP}) is available without
    # listing it here. required:false keeps `up` working before .env exists.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config.yaml:/config/config.yaml:ro
